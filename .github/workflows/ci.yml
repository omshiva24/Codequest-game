name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test and build (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter build web --release --no-web-resources-cdn

  api:
    name: Test the doubt-solver API (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: flutter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      # Native folders are generated, so the repo stays small and clean.
      - run: flutter create --platforms=android --org io.github.omshiva24 --project-name codequest .
      - run: flutter build apk --release --dart-define=TUTOR_API_BASE=https://codequest-game-amber.vercel.app
      - uses: actions/upload-artifact@v7
        with:
          name: codequest-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
